<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças do Casal</title>
  <!-- Tailwind CSS para design moderno e responsivo no celular -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js para gráficos de investimentos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-12">
  <!-- Cabeçalho -->
  <header class="bg-indigo-700 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">💰 Finanças do Casal</h1>
      <span class="text-xs bg-indigo-800 px-3 py-1 rounded-full">Ambiente Privado</span>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <!-- Status da Conexão -->
    <div id="status-box" class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded text-sm text-blue-700">
      Conectando ao banco de dados Supabase...
    </div>

    <!-- Resumo Rápido -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 font-semibold uppercase">Total Contas da Casa</p>
        <p id="total-shared" class="text-2xl font-extrabold text-gray-900 mt-1">R$ 0,00</p>
        <p class="text-xs text-indigo-600 font-medium mt-1">R$ 0,00 por pessoa (50%)</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 font-semibold uppercase">Investimento Acumulado</p>
        <p id="total-invested" class="text-2xl font-extrabold text-emerald-600 mt-1">R$ 0,00</p>
        <p class="text-xs text-gray-400 mt-1">Renda Fixa</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500 font-semibold uppercase">Pendentes no Mês</p>
        <p id="pending-count" class="text-2xl font-extrabold text-amber-600 mt-1">0 contas</p>
        <p class="text-xs text-gray-400 mt-1">Aguardando pagamento</p>
      </div>
    </div>

    <!-- Abas de Navegação -->
    <div class="flex border-b border-gray-200 bg-white rounded-t-xl px-2">
      <button onclick="switchTab('lancamentos')" class="tab-btn font-medium py-3 px-4 border-b-2 border-indigo-600 text-indigo-600" id="tab-lancamentos">Apontamentos</button>
      <button onclick="switchTab('calendario')" class="tab-btn font-medium py-3 px-4 border-b-2 border-transparent text-gray-500 hover:text-gray-700" id="tab-calendario">Próximos 12 Meses</button>
      <button onclick="switchTab('investimentos')" class="tab-btn font-medium py-3 px-4 border-b-2 border-transparent text-gray-500 hover:text-gray-700" id="tab-investimentos">Investimentos & Simulação</button>
    </div>

    <!-- Conteúdo das Abas -->
    <div id="content-area" class="bg-white p-6 rounded-b-xl shadow-sm border border-t-0 border-gray-200">
      <p class="text-gray-600">Carregando módulos do sistema...</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
